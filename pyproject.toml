[project]
name = "git-rich-stats"
version = "0.1.3"
description = "一款基于 Click 和 Rich 库构建的 Git 统计工具，提供丰富的终端输出"
readme = "README.md"
authors = [
    { name = "BytemanD", email = "byteman.d@outlook.com" }
]
requires-python = ">=3.10.0"
dependencies = [
    "click>=8.3.1",
    "gitpython>=3.1.46",
    "pystonic>=0.1.7",
    "rich>=14.3.3",
]

[project.scripts]
git-rich-stats = "git_rich_stats.cmd.main:app"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv.sources]
pystonic = { index = "testpypi" }

[[tool.uv.index]]
name = "tencent"
url = "http://mirrors.cloud.tencent.com/pypi/simple"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.15.8",
]
